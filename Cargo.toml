[workspace]
members = [
    "crates/ftts-core",
    "crates/ftts-model-qwen",
    "crates/ftts-artifacts",
    "crates/ftts-kernels",
    "crates/ftts-cli",
    "crates/ftts-conformance",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/franken_tts"

[workspace.dependencies]
asupersync = { path = "../asupersync", version = "0.4.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-perf]
inherits = "release"
debug = true
strip = "none"
