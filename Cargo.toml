[workspace]
members = [
    "crates/ftts-core",
    "crates/ftts-model-qwen",
    "crates/ftts-artifacts",
    "crates/ftts-kernels",
    "crates/ftts-cli",
    "crates/ftts-video",
    "crates/ftts-voicecard",
    "crates/ftts-conformance",
    "crates/ftts-wasm",
    "crates/ftts-ffi",
]
resolver = "3"

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/franken_tts"

[workspace.dependencies]
# Pinned to crates.io (latest published), NOT the sibling checkout: the sibling's main
# is mid-development and its transient states (deny-lint failures, API churn) were
# breaking every downstream cold build. Owner directive 2026-08-22. Bump deliberately.
asupersync = { version = "0.4.9", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-perf]
inherits = "release"
debug = true
strip = "none"
