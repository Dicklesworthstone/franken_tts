[package]
name = "ftts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ftts-artifacts = { path = "../ftts-artifacts" }
ftts-core = { path = "../ftts-core" }
ftts-kernels = { path = "../ftts-kernels" }
ftts-model-qwen = { path = "../ftts-model-qwen" }
serde_json = "1.0"
symphonia = { version = "0.5.4", default-features = false, features = ["flac", "pcm", "wav"] }

[[bin]]
name = "franken_tts"
path = "src/main.rs"

[[bin]]
name = "ftts"
path = "src/bin/ftts.rs"

[lints]
workspace = true
