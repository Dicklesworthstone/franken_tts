[package]
name = "ftts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "franken_tts CLI: pure-Rust Qwen3-TTS voice synthesis (`ftts say`), no Python, no GPU"
keywords = ["tts", "speech", "qwen", "voice", "audio"]
categories = ["multimedia::audio"]
autobins = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ftts-artifacts = { path = "../ftts-artifacts", version = "0.1.2" }
ftts-core = { path = "../ftts-core", version = "0.1.2" }
ftts-kernels = { path = "../ftts-kernels", version = "0.1.2" }
ftts-model-qwen = { path = "../ftts-model-qwen", version = "0.1.2" }
serde_json = "1.0"
symphonia = { version = "0.5.4", default-features = false, features = ["flac", "pcm", "wav"] }

[[bin]]
name = "franken_tts"
path = "src/main.rs"

[[bin]]
name = "ftts"
path = "src/bin/ftts.rs"

[lints]
workspace = true
