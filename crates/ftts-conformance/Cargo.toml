[package]
name = "ftts-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[features]
# Full-model numerical/oracle certification. Kept out of the default test graph because these
# binaries perform many complete syntheses and can take well over an hour on a busy host.
ultra-tests = ["ftts-cli/ultra-tests"]

[dependencies]
ftts-artifacts = { path = "../ftts-artifacts" }
ftts-cli = { path = "../ftts-cli" }
ftts-core = { path = "../ftts-core" }
ftts-kernels = { path = "../ftts-kernels" }
ftts-model-qwen = { path = "../ftts-model-qwen" }
serde_json = "1.0"
sha2 = "0.10"

[lints]
workspace = true
