[package]
name = "ftts-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "CPU kernels and f32 reference numerics for franken_tts (Qwen3-TTS in pure Rust)"
keywords = ["tts", "speech", "qwen", "voice", "audio"]
categories = ["multimedia::audio"]

[features]
default = ["native-mmap", "accelerate-sgemm", "neon-dotprod", "x86-int8", "x86-f32"]
# The only audited OS-memory interface in this crate. Disabling it preserves correctness through
# the owned-byte fallback, which is useful for targets without a supported mmap implementation.
native-mmap = []
# Apple-platform f32 SGEMM backend for the native codec and for reproducing the pinned CPU-fp32
# Torch backend. The normal safe-Rust reference path remains available as the fallback/oracle.
accelerate-sgemm = []
# The audited aarch64 SDOT island in `int8.rs`. Compiles only on aarch64 targets, dispatches only
# where the CPU reports FEAT_DotProd at runtime, and keeps a bit-identical portable fallback in
# the same module. Disabling it removes the island entirely; the scalar/autovec routes remain.
neon-dotprod = []
# The audited x86-64 int8 islands in `int8.rs` (AVX2, AVX-VNNI, AVX-512 VNNI). Compile only on
# x86_64 targets, dispatch only where the CPU reports the feature at runtime (the release binaries
# target baseline x86-64, so nothing here raises the minimum CPU), and keep the bit-identical
# portable fallback in the same module. Disabling it removes the islands entirely.
x86-int8 = []
# Runtime-dispatched AVX2 / AVX-512F instantiations of the packed f32 GEMM (`packed_gemm.rs`), the
# codec's dense kernel off macOS. No intrinsics: the shared scalar body compiled under wider target
# features, bit-identical to the portable instantiation (pinned by tests). Disabling it leaves only
# the portable build.
x86-f32 = []

[dependencies]
# Pure-Rust libm: the canonical-mode transcendentals (erf for the codec ConvNeXt
# GELU) need the SAME implementation on every target — std erf binds the system
# libm on macOS-native but a pure-Rust port on wasm32, and the two disagree by
# f32-visible ulps (frankentts-uuac / DISC-006 seam-B).
libm = "0.2"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
