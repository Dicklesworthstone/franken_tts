[package]
name = "ftts-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Weight containers and safetensors reading for franken_tts (.fttsq, census, conversion)"
keywords = ["tts", "speech", "qwen", "voice", "audio"]
categories = ["multimedia::audio"]

[dependencies]
ftts-core = { path = "../ftts-core", version = "0.1.6" }
ftts-kernels = { path = "../ftts-kernels", version = "0.1.6" }
serde_json = "1.0"
# One-shot SHA-256 only (see sha256::digest). RustCrypto dispatches the ARMv8 and x86 SHA
# extensions at runtime, which turns whole-artifact verification from seconds into a rounding
# error; the streaming writer keeps this crate's own implementation.
sha2 = "0.10"

[lints]
workspace = true
