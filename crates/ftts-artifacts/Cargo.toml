[package]
name = "ftts-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Weight containers and safetensors reading for franken_tts (.fttsq, census, conversion)"
keywords = ["tts", "speech", "qwen", "voice", "audio"]
categories = ["multimedia::audio"]

[dependencies]
ftts-core = { path = "../ftts-core", version = "0.1.10" }
ftts-kernels = { path = "../ftts-kernels", version = "0.1.10" }
serde_json = "1.0"
# One-shot SHA-256 only (see sha256::digest). `sha2`'s ARM hardware backend is
# feature-gated rather than part of its defaults; without this feature an A18
# silently runs the portable compression loop over the complete 1.3 GB
# artifact during every hydration. The backend still runtime-checks SHA2 and
# falls back safely on older ARM targets. The streaming writer keeps this
# crate's own implementation.
sha2 = { version = "0.10", features = ["asm"] }

[lints]
workspace = true
